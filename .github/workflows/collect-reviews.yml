name: Collect App Store reviews

on:
  schedule:
    # 每周一 03:00 UTC（中国区 cn RSS 采集）
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect reviews for sample apps
        run: |
          for app in 839285684 1544884479; do
            python scripts/fetch_reviews.py "$app" --country cn --delay 0.5 --refresh --method auto
          done
        env:
          PYTHONPATH: src
      - name: Commit cached data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore(data): refresh cached App Store reviews"
            git push
          fi
