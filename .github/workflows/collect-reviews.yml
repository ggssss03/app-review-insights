name: Collect App Store reviews

on:
  schedule:
    # 每周一 03:00 UTC（中国区 cn RSS 采集）
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh live review caches (US storefront for assessment sample)
        run: |
          # 主评估样例 839285684 只采集美区 itml（Apple 官方接口，当前返回 10 条热门评论）；
          # 其余样例为区域专属应用，仍用 cn 多源合并作为泛化演示。
          python scripts/fetch_reviews.py 839285684 --country us --delay 0.5 --refresh --method itml
          python scripts/fetch_reviews.py 1544884479 --country cn --delay 0.5 --refresh --method auto
          python scripts/fetch_reviews.py 1321803705 --country cn --delay 0.5 --refresh --method auto
        env:
          PYTHONPATH: src
      - name: Commit cached data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore(data): refresh cached App Store reviews"
            git push
          fi
