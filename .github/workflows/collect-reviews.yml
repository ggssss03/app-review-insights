name: Collect App Store reviews

on:
  schedule:
    # 每周一 03:00 UTC（中国区 cn RSS 采集）
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh live review caches (multi-source merge)
        run: |
          # 多源合并采集：cn RSS（自动重试）+ 产品页内嵌评论 + 美国区 itml，
          # 去重后健身 App 通常 45 条、其余应用取可用来源。
          python scripts/fetch_reviews.py 839285684 --country cn --delay 0.5 --refresh --method auto
          python scripts/fetch_reviews.py 1544884479 --country cn --delay 0.5 --refresh --method auto
          python scripts/fetch_reviews.py 1321803705 --country cn --delay 0.5 --refresh --method auto
        env:
          PYTHONPATH: src
      - name: Commit cached data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore(data): refresh cached App Store reviews"
            git push
          fi
