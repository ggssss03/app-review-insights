name: Collect App Store reviews

on:
  schedule:
    # 每周一 03:00 UTC（中国区 cn RSS 采集）
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh live review caches (skips apps with frozen datasets)
        run: |
          # 839285684 使用固定 38 条数据集（imported-reviews.json），
          # 不再用实时 feed 覆盖；蛋仔派对等示例应用保留实时采集作参考。
          python scripts/fetch_reviews.py 1544884479 --country cn --delay 0.5 --refresh --method auto
          python scripts/fetch_reviews.py 1321803705 --country cn --delay 0.5 --refresh --method auto
        env:
          PYTHONPATH: src
      - name: Commit cached data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore(data): refresh cached App Store reviews"
            git push
          fi
