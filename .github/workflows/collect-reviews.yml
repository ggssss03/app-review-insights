name: Collect App Store reviews

on:
  schedule:
    # 每周一 03:00 UTC（主样例美区 itml 采集）
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh live review caches (US storefront for assessment sample)
        run: |
          # 主评估样例 839285684 尝试美区 AMP 接口；实测 AMP token 已不可获取，
          # 因此实际回退到 itml（固定返回 10 条美区热门评论）。
          python scripts/fetch_reviews.py 839285684 --country us --delay 1 --refresh --method amp || true
          if ! ls data/raw/839285684/reviews-amp-offset-*.json >/dev/null 2>&1; then
            python scripts/fetch_reviews.py 839285684 --country us --refresh --method itml || true
          fi
        env:
          PYTHONPATH: src
      - name: Commit cached data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore(data): refresh cached App Store reviews"
            git push
          fi
